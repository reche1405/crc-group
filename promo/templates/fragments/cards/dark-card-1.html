<div class="card card--dark card-dark--1 p-5 br-2 fade-up-item">

        <h4 class="average-text heavy-weight fade-left-item">{{card.text}}</h4>

        <p class="fade-left-item">{{card.subtext}}</p>
    </div>
</div>
